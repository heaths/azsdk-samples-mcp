version: 2
updates:
  - package-ecosystem: dotnet-sdk
    directories:
      - /src/*
      - /tests/*
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "Azure.*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      all-other-dotnet:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "azure_*"
      all-other-cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "@azure/*"
      all-other-npm:
        patterns:
          - "*"
