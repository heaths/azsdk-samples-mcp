version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "Azure.*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      all-other-dotnet:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "azure_*"
      all-other-cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "@azure/*"
      all-other-npm:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directories:
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "github.com/Azure/azure-sdk-for-go/*"
      all-other-go:
        patterns:
          - "*"
  - package-ecosystem: maven
    directories:
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "com.azure:*"
      all-other-maven:
        patterns:
          - "*"
  - package-ecosystem: pip
    directories:
      - /samples/*
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns:
          - "azure-*"
      all-other-pip:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
